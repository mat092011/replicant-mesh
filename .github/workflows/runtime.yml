name: CPU runtime gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker compose -f compose.pytorch.yaml build prepare
      - run: docker compose -f compose.pytorch.yaml run --rm prepare
      - run: docker compose -f compose.pytorch.yaml run --rm tests
      - run: docker compose -f compose.pytorch.yaml up -d --wait worker-1 worker-2 worker-3 coordinator pipeline-benchmark
      - run: docker compose -f compose.pytorch.yaml run --rm --no-deps service-check
      - run: docker compose -f compose.pytorch.yaml exec -T pipeline-benchmark python -m lab.benchmark bench --backend pipeline --coordinator coordinator:50052 --prompt-tokens 128 --new-tokens 8 --concurrency 3 --requests 6 --label ci-smoke
      - if: always()
        run: docker compose -f compose.pytorch.yaml down --volumes
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cpu-runtime-evidence
          path: .lab/pytorch-results/
          retention-days: 7
