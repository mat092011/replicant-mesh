# M0-M5: supervised workers/coordinator, private lab and offline validation.
# Network shaping is confined to the four inference-service network namespaces.
name: replicant-mesh-pytorch-m1

x-common: &common
  image: replicant-mesh-pytorch:cpu
  platform: linux/amd64
  build:
    context: .
    dockerfile: docker/pytorch/Dockerfile
    target: runtime
  init: true
  restart: "no"
  cpus: 2.0
  mem_limit: 6g
  pids_limit: 256
  security_opt: [no-new-privileges:true]
  environment: &environment
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    REPLICANT_MESH_ARTIFACT_DIR: /artifacts
    REPLICANT_MESH_REFERENCE_DIR: /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f
    REPLICANT_MESH_TEST_SNAPSHOT: /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f
    REPLICANT_MESH_PROTOCOL_TESTS: "1"
  volumes:
    - pytorch-model-cache:/cache:ro
    - pytorch-artifacts:/artifacts:ro
    - ./.lab/pytorch-results:/results

services:
  prepare:
    <<: *common
    command: [python, -m, replicant_mesh.prepare, --output, /artifacts]
    environment:
      <<: *environment
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - pytorch-model-cache:/cache
      - pytorch-artifacts:/artifacts
    networks: [download]

  tests:
    <<: *common
    command: [python, -m, unittest, discover, -s, tests, -v]
    network_mode: none
    environment:
      <<: *environment
      REPLICANT_MESH_TEST_REPORT: ${REPLICANT_MESH_TEST_REPORT:-/results}
      REPLICANT_MESH_PROTOCOL_REPORT: ${REPLICANT_MESH_PROTOCOL_REPORT:-/results}
      REPLICANT_MESH_PROCESS_TESTS: "1"
      REPLICANT_MESH_COORDINATOR_TESTS: "1"
      REPLICANT_MESH_SERVICE_TESTS: "1"

  benchmark:
    <<: *common
    network_mode: none
    command:
      - python
      - -m
      - lab.benchmark
      - check
      - --backend
      - pytorch
      - --artifacts
      - /artifacts
      - --reference
      - /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f

  worker-1: &worker
    <<: *common
    command: [python, -m, replicant_mesh.worker, serve, --artifacts, /artifacts, --worker, worker-1, --host, "0.0.0.0:50051", --private-network]
    mem_limit: 3g
    cap_add: [NET_ADMIN]
    stop_grace_period: 20s
    volumes:
      - pytorch-artifacts:/artifacts:ro
    networks: [workers]
    healthcheck:
      test: [CMD, python, -m, replicant_mesh.worker, health, --target, "127.0.0.1:50051", --artifacts, /artifacts, --worker, worker-1]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker-2:
    <<: *worker
    command: [python, -m, replicant_mesh.worker, serve, --artifacts, /artifacts, --worker, worker-2, --host, "0.0.0.0:50051", --private-network]
    healthcheck:
      test: [CMD, python, -m, replicant_mesh.worker, health, --target, "127.0.0.1:50051", --artifacts, /artifacts, --worker, worker-2]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker-3:
    <<: *worker
    command: [python, -m, replicant_mesh.worker, serve, --artifacts, /artifacts, --worker, worker-3, --host, "0.0.0.0:50051", --private-network]
    healthcheck:
      test: [CMD, python, -m, replicant_mesh.worker, health, --target, "127.0.0.1:50051", --artifacts, /artifacts, --worker, worker-3]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  remote-check:
    <<: *common
    command: [python, -m, replicant_mesh.remote_check, --artifacts, /artifacts, --reference, /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f, --workers, "worker-1:50051", "worker-2:50051", "worker-3:50051", --output, /results]
    networks: [workers]
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy

  coordinator-check:
    <<: *common
    command: [python, -m, replicant_mesh.coordinator_check, --artifacts, /artifacts, --reference, /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f, --workers, "worker-1:50051", "worker-2:50051", "worker-3:50051", --output, /results]
    networks: [workers]
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy

  coordinator:
    <<: *common
    command: [python, -m, replicant_mesh.coordinator_service, serve, --artifacts, /artifacts, --workers, "worker-1:50051", "worker-2:50051", "worker-3:50051", --host, "0.0.0.0:50052", --private-network]
    mem_limit: 3g
    cap_add: [NET_ADMIN]
    stop_grace_period: 40s
    volumes:
      - pytorch-artifacts:/artifacts:ro
    networks: [workers]
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, replicant_mesh.coordinator_service, health, --target, "127.0.0.1:50052", --artifacts, /artifacts]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  pipeline-benchmark:
    <<: *common
    command: [python, -c, "import time; time.sleep(10**9)"]
    cpus: 1.0
    mem_limit: 1g
    volumes:
      - ./.lab/pytorch-results:/results
    networks: [workers]
    depends_on:
      coordinator:
        condition: service_healthy

  service-check:
    <<: *common
    command: [python, -m, replicant_mesh.service_check, --artifacts, /artifacts, --reference, /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f, --coordinator, "coordinator:50052", --output, /results]
    networks: [workers]
    depends_on:
      coordinator:
        condition: service_healthy

  replica-1: &matched-replica
    <<: *common
    command: [python, -m, lab.matched_control, serve, --artifacts, /artifacts, --reference, /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f, --host, "0.0.0.0:50053"]
    mem_limit: 3g
    cap_add: [NET_ADMIN]
    stop_grace_period: 20s
    volumes:
      - pytorch-model-cache:/cache:ro
      - pytorch-artifacts:/artifacts:ro
      - ./.lab/pytorch-results:/results
    networks: [workers]
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',50053),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  replica-2:
    <<: *matched-replica

  replica-3:
    <<: *matched-replica

  replica-4:
    <<: *matched-replica

  matched-control-check:
    <<: *common
    command: [python, -m, lab.matched_control, check, --artifacts, /artifacts, --reference, /cache/huggingface/hub/models--Maykeye--TinyLLama-v0/snapshots/298338802ab94432b917bcce11382aa151aee50f, --replicas, "replica-1:50053", "replica-2:50053", "replica-3:50053", "replica-4:50053", --output, /results/matched-control-check.json]
    volumes:
      - pytorch-model-cache:/cache:ro
      - pytorch-artifacts:/artifacts:ro
      - ./.lab/pytorch-results:/results
    networks: [workers]
    depends_on:
      replica-1:
        condition: service_healthy
      replica-2:
        condition: service_healthy
      replica-3:
        condition: service_healthy
      replica-4:
        condition: service_healthy

networks:
  download: {}
  workers:
    internal: true

volumes:
  pytorch-model-cache:
  pytorch-artifacts:
