syntax = "proto3";
package replicant.mesh.v1;

// V1 only transports dense, contiguous little-endian float32 activations.
// Each message is capped at 1 MiB before Protobuf parsing. The receiver checks
// every dimension and byte count before creating a tensor.
message TensorEnvelope {
  repeated uint32 shape = 1;
  string dtype = 2;
  string layout = 3;
  uint64 byte_count = 4;
  bytes data = 5;
}

message Request {
  uint32 protocol_version = 1;
  string manifest_fingerprint = 2;
  string worker_boot_id = 3;
  string session_id = 4;
  string lease_token = 5;
  uint32 timeout_ms = 6;
  uint32 max_positions = 7;
  uint32 lifetime_ms = 8;
  uint32 idle_lease_ms = 9;
  uint64 sequence = 10;
  uint32 start_position = 11;
  uint32 token_count = 12;
  TensorEnvelope tensor = 13;
}

message Response {
  uint32 protocol_version = 1;
  string manifest_fingerprint = 2;
  string worker_boot_id = 3;
  string session_id = 4;
  string lease_token = 5;
  uint64 sequence = 6;
  // Stable values are defined in errors.py. Successful operations use "OK".
  string code = 7;
  string message = 8;
  uint32 end_position = 9;
  uint64 next_sequence = 10;
  uint32 max_positions = 11;
  uint32 remaining_lifetime_ms = 12;
  uint32 remaining_idle_ms = 13;
  string state = 14;
  bool reclaimed = 15;
  TensorEnvelope tensor = 16;
  bool ready = 17;
  uint32 layer_start = 18;
  uint32 layer_end = 19;
  uint32 hidden_size = 20;
  uint32 active_sessions = 21;
  uint32 reserved_positions = 22;
  uint64 allocated_cache_bytes = 23;
  uint32 max_sessions = 24;
  uint32 max_positions_limit = 25;
  uint32 max_message_bytes = 26;
  double queue_ms = 27;
  double compute_ms = 28;
  uint32 start_position = 29;
  uint32 token_count = 30;
  bool cache_bytes_exact = 31;
  uint32 active_operations = 32;
  uint32 tombstones = 33;
  bool requires_restart = 34;
  uint32 max_cache_positions = 35;
  uint64 max_cache_bytes = 36;
  uint32 lease_check_interval_ms = 37;
  uint32 rpc_timeout_ms = 38;
  uint32 queued_operations = 39;
  uint32 max_stage_queue = 40;
  // Actual execution-thread spans; compare across workers only after verifying
  // a shared Linux clock domain and a bracketed Describe monotonic_ns sample.
  uint64 compute_start_ns = 41;
  uint64 compute_end_ns = 42;
  string clock_id = 43;
  uint64 monotonic_ns = 44;
}

service Worker {
  rpc Describe(Request) returns (Response);
  rpc OpenSession(Request) returns (Response);
  rpc RenewSession(Request) returns (Response);
  rpc Step(Request) returns (Response);
  rpc CloseSession(Request) returns (Response);
  rpc CancelSession(Request) returns (Response);
  rpc SessionStatus(Request) returns (Response);
}
